# User-editable LLM-to-role assignments.
# Set `llm` to a simple lowercase family name such as claude, gpt, or gemini.
# Any model in that family should treat the matching assignment as its own.
# Never store API keys, access tokens, credentials, or endpoints here.

schema_version: 1

project:
  name: Multi-Agent Engineering Framework
  languages:
    user_interface: tr-TR
    engineering: en

governance:
  strict_role_boundaries: true
  one_active_owner_per_task: true
  block_unassigned_roles: true
  prohibit_self_review: true
  require_independent_review: true
  security_blocking_severities:
    - high
    - critical

concurrency:
  worktree_required: true
  direct_main_writes: false
  task_lock_required: true
  lock_storage: git-common-directory
  allow_overlapping_write_scopes: false
  branch_pattern: agent/<llm>/<role>/<task-id>

routing:
  coordinator_role: orchestrator
  unassigned_role_behavior: block-and-ask-user
  cross_role_request_behavior: split-and-handoff
  multiple_roles_for_same_llm: require-explicit-role

review:
  reviewer_role: reviewer
  require_separate_execution: true
  prefer_different_llm: true

# The mapping key is the canonical role ID and must match `.agents/<role>/`.
# `title` and `llm` are intended to be edited by the user.
# A null `llm` value means the role is unassigned and must not run.
assignments:
  manager:
    title: Project Manager
    role_path: .agents/manager
    enabled: true
    llm: null
    task_queue: plans/backlog
    write_scope:
      - ROADMAP.md
      - SPRINT.md
      - GOVERNANCE.md
      - plans/**

  architect:
    title: Solution Architect
    role_path: .agents/architect
    enabled: true
    llm: null
    task_queue: tasks/ready
    write_scope:
      - ARCHITECTURE.md
      - docs/architecture/**
      - docs/adr/**
      - diagrams/architecture/**

  orchestrator:
    title: Orchestrator
    role_path: .agents/orchestrator
    enabled: true
    llm: null
    task_queue: tasks/ready
    write_scope:
      - tasks/**
      - .agents/ROUTING.md
      - .agents/HANDOFF.md

  reviewer:
    title: Independent Reviewer
    role_path: .agents/reviewer
    enabled: true
    llm: null
    task_queue: tasks/review
    write_scope:
      - REVIEW.md
      - reports/code-review/**

  backend:
    title: Backend Engineer
    role_path: .agents/backend
    enabled: true
    llm: null
    task_queue: tasks/ready
    write_scope:
      - src/backend/**
      - tests/unit/backend/**

  frontend:
    title: Frontend Engineer
    role_path: .agents/frontend
    enabled: true
    llm: null
    task_queue: tasks/ready
    write_scope:
      - src/frontend/**
      - tests/unit/frontend/**

  database:
    title: Database Engineer
    role_path: .agents/database
    enabled: true
    llm: null
    task_queue: tasks/ready
    write_scope:
      - schema/**
      - specs/database/**
      - tests/unit/database/**

  security:
    title: Security Engineer
    role_path: .agents/security
    enabled: true
    llm: null
    task_queue: tasks/review
    write_scope:
      - SECURITY.md
      - SECURITY_REPORT.md
      - reports/security/**
      - specs/security/**

  qa:
    title: QA Engineer
    role_path: .agents/qa
    enabled: true
    llm: null
    task_queue: tasks/review
    write_scope:
      - BUG_REPORT.md
      - reports/qa/**
      - tests/integration/**
      - tests/e2e/**
      - tests/fixtures/**

  performance:
    title: Performance Engineer
    role_path: .agents/performance
    enabled: true
    llm: null
    task_queue: tasks/review
    write_scope:
      - PERFORMANCE_REPORT.md
      - reports/performance/**
      - tests/performance/**

  devops:
    title: DevOps Engineer
    role_path: .agents/devops
    enabled: true
    llm: null
    task_queue: plans/releases
    write_scope:
      - .github/workflows/**
      - Dockerfile
      - docker-compose.yml
      - scripts/ci/**
      - scripts/deploy/**
      - scripts/release/**
      - scripts/setup/**
      - config/environments/**

  docs:
    title: Documentation Engineer
    role_path: .agents/docs
    enabled: true
    llm: null
    task_queue: tasks/review
    write_scope:
      - README.md
      - PROJECT_STRUCTURE.md
      - CHANGELOG.md
      - CONTRIBUTING.md
      - SUPPORT.md
      - RELEASE_NOTES.md
      - docs/api/**
      - docs/guides/**
      - docs/runbooks/**
