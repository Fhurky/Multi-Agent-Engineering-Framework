name: Release Readiness

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic release version
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-readiness:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release prerequisites
        shell: pwsh
        run: ./scripts/release/validate-release.ps1 -Version '${{ inputs.version }}'
